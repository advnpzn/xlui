name: Verify requested revision 4bf7fd0c
on:
  push:
    branches: [verify/operator-changes-on-demand]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: 4bf7fd0ce91bf50c8d203032e2a643a7119965a5
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = 4bf7fd0ce91bf50c8d203032e2a643a7119965a5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Check formatting and module metadata
        run: |
          go fmt ./...
          go mod tidy
          git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check for known vulnerabilities in reachable Go code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Measure bulk inventory parsing
        run: go test -run '^$' -bench BenchmarkReadDomains -benchmem ./internal/xen/xl
      - name: Build static Linux clients
        shell: bash
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "xlui-linux-$arch" ./cmd/xlui
            if readelf -l "xlui-linux-$arch" | grep -q INTERP; then exit 1; fi
            if readelf -d "xlui-linux-$arch" | grep -q NEEDED; then exit 1; fi
          done
