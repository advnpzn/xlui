name: Go
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_call:
    inputs:
      source_ref:
        type: string
    outputs:
      tested_sha:
        value: ${{ jobs.test.outputs.sha }}
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Unit tests and static builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check formatting and module metadata
        run: |
          go fmt ./...
          go mod tidy
          git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check for known vulnerabilities in reachable Go code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Measure bulk inventory parsing
        run: go test -run '^$' -bench BenchmarkReadDomains -benchmem ./internal/xen/xl
      - name: Build static Linux clients
        shell: bash
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "xlui-linux-$arch" ./cmd/xlui
            segments=$(readelf -lW "xlui-linux-$arch")
            dynamic=$(readelf -dW "xlui-linux-$arch")
            [[ "$segments" != *INTERP* && "$dynamic" != *NEEDED* ]]
          done
