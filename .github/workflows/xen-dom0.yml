name: Xen Dom0
on:
  pull_request:
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'packaging/xen/**', '.github/workflows/xen-dom0.yml']
  push:
    branches: [master]
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'packaging/xen/**', '.github/workflows/xen-dom0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    name: Exercise the TUI in an ARM64 Xen Dom0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    steps:
      - name: Install build and emulation tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates cpio debian-archive-keyring git openssh-client python3-pexpect qemu-system-arm util-linux xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build the client and run the live Dom0 check
        run: |
          install -d -m 0755 /tmp/xlui-dom0-check
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -o /tmp/xlui-dom0-check/xlui ./cmd/xlui
          cp -R packaging/xen /tmp/xlui-dom0-check/
          runuser -u nobody -- bash /tmp/xlui-dom0-check/xen/boot-arm64.sh /tmp/xlui-dom0-check/xlui
